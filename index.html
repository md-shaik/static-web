<!DOCTYPE html>
<html>
<head>
    <title>Simple Website</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            color: blue;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <p>This is a simple HTML webpage.</p>

    <button onclick="showMessage()">
        Click Me
    </button>

    <script>
        function showMessage() {
            alert("Hello! Welcome to HTML.");
        }
    </script>

</body>
</html>
